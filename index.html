    function findCardPage(){const spend=["Shopping","Travel","Dining","Fuel","Online purchases","Everyday expenses"],priority=["Cashback","Rewards","Lounge Access","Discounts","Lifetime Free"],fee=["Lifetime Free","Under ₹500","Flexible","Premium"];if(finder.step>=3){const target=[finder.spend,finder.priority].map(x=>x.toLowerCase());const matches=creditCards.filter(c=>c.types.concat(c.benefits).some(t=>target.some(q=>t.toLowerCase().includes(q)||q.includes(t.toLowerCase()))));return `<section class="page-hero"><div class="container"><span class="eyebrow">Your shortlist</span><h1>Cards matching your selected preferences.</h1><p class="lead">These cards share frontend category tags with your spend and benefit choices. Annual fee information is not maintained here, so check provider terms. This is not personalized financial advice or a guarantee of suitability.</p></div></section><section class="section"><div class="container">${productCards(matches.slice(0,8),true)}<div style="margin-top:22px"><button class="button outline" data-finder-restart>Start over</button></div></div></section>`}const options=[spend,priority,fee][finder.step];const title=["What do you spend most on?","What matters most?","Preferred annual fee?"][finder.step];const key=["spend","priority","fee"][finder.step];return `<section class="section"><div class="container"><div class="steps"><span class="eyebrow">Find my card · Step ${finder.step+1} of 3</span><h1 style="font-size:clamp(2.3rem,4.7vw,4rem)">${title}</h1><div class="step-bar"><span style="width:${(finder.step+1)*33.333}%"></span></div><div class="need-grid">${options.map(x=>`<button class="need-card" style="text-align:left;cursor:pointer;${finder[key]===x?"border-color:#6aaa67;background:#f2f7ed":""}" data-finder-choice="${escapeHtml(x)}"><h3>${escapeHtml(x)}</h3><p>Select to continue</p></button>`).join("")}</div><div style="margin-top:24px;display:flex;gap:10px"><button class="button outline" data-finder-back ${finder.step===0?"disabled"       if(step===1)fields=business?`<div class="form-grid">${input("businessName","Business name")}${`<div class="field"><label for="apply-businessType">Business type</label><select id="apply-businessType" name="businessType" required><option value="">Choose a business type</option>${["Sole proprietorship","Partnership","Private limited company","LLP","Other"].map(x=>`<option ${draft.businessType===x?"selected":""}>${x}</option>`).join("")}</select><small class="inline-error" data-error-for="businessType"></small></div>`}${input("businessVintage","Business vintage (years)","number",'min="0"')}</div>`:`<div class="form-grid">${input("product","Product")}${input("amount","Amount required (₹)","number",'min="1"')}${input("tenure","Preferred tenure (months)","number",'min="1" max="360"')}</div>`;
      if(step===2)fields=business?`<div class="form-grid">${input("amount","Required loan amount (₹)","number",'min="1"')}${input("purpose","Purpose of financing")}${input("city","City")}</div>`:`<div class="form-grid">${input("income","Monthly income (₹)","number",'min="1"')}${input("employment","Employment type")}${input("city","City")}</div>`;
      if(step===3){const review=business?[["Full name","name"],["Mobile","mobile"],["Email","email"],["Business name","businessName"],["Business type","businessType"],["Business vintage (years)","businessVintage"],["Product","product"],["Loan amount","amount"],["Purpose","purpose"],["City","city"]]:[["Full name","name"],["Mobile","mobile"],["Email","email"],["Product","product"],["Amount","amount"],["Tenure","tenure"],["Income","income"],["Employment","employment"],["City","city"]];fields=`<div class="detail-facts">${review.map(([label,key])=>`<div class="detail-fact"><small>${label}</small><strong>${escapeHtml(draft[key]||"—")}</strong></div>`).join("")}</div><div class="notice">Your information stays in this browser's local storage in this frontend demo. It is not transmitted to Credigo or a lender.</div>`}
      return `<section class="page-hero"><div class="container"><span class="eyebrow">Application request · Step ${step+1} of 4</span><h1>Take your next step, simply.</h1><p class="lead">Complete a short request. This is a frontend-only demonstration; information is stored locally on this device.</p></div></section><section class="section"><div class="container"><div class="form-card"><div class="step-dots">${labels.map((x,i)=>`<span class="${i===step?"current":""}">${i+1} · ${x}</span>`).join("")}</div><div class="step-bar"><span style="width:${(step+1)*25}%"></span></div><form id="application-form" data-step="${step}" novalidate>${fields}<div class="form-actions">${step?'<button class="button outline" type="button" data-app-back>Back</button>':'<span></span>'}<button class="button primary" type="submit">${step===3?"Submit request":"Continue"} <span class="arrow">→</span></button></div></form></div></div></section>`;
    }
    function statusPage(){return `<section class="page-hero"><div class="container"><span class="eyebrow">Application status</span><h1>Find your application request.</h1><p class="lead">Look up a reference saved in this browser. This is a frontend-only status experience.</p></div></section><section class="section"><div class="container status-layout"><form class="form-card" id="status-form" novalidate><div class="field"><label for="status-reference">Application reference number</label><input id="status-reference" name="reference" placeholder="CRD-123456" required><small class="inline-error" data-error-for="reference"></small></div><button class="button primary" type="submit">Check status <span class="arrow">→</span></button><div id="status-result" style="margin-top:16px"></div></form></div></section>`}
    function notFound(){return `<section class="section"><div class="container empty-state"><span class="eyebrow">Page not found</span><h1 style="font-size:2.6rem">That path isn't here.</h1><p>Try exploring the Credigo marketplace instead.</p><a class="button primary" ${href("/")}>Go to home</a></div></section>`}
    function routePage(){const path=routePath();if(path==="/")return home();if(path==="/credit-cards")return catalog();if(path==="/credit-cards/compare")return comparePage();if(path==="/credit-cards/find")return findCardPage();const cardRoute=path.match(/^\/credit-cards\/([^/]+)\/([^/]+)$/);if(cardRoute)return cardDetail(cardRoute[2]);if(path.startsWith("/credit-cards/"))return bankPage(path.split("/")[2]);for(const kind of Object.keys(loanCatalog)){const base=`/${kind}-loans`;if(path===base)return loanPage(kind);if(path.startsWith(base+"/"))return loanPage(kind,path.slice(base.length+1))}if(path==="/emi")return emiPage();if(path==="/iphone-on-emi")return emiPage(true);if(path==="/eligibility")return eligibilityPage();if(path==="/apply")return applicationPage();if(path==="/application-status")return statusPage();if(path==="/about")return about();if(path==="/faq")return faqPage();return notFound()}
    function render(){app.innerHTML=routePage();footer.innerHTML=footerMarkup();document.querySelectorAll(".brand-logo").forEach(logo=>logo.src=logoSrc(logo.dataset.logo));if(location.protocol==="file:")document.querySelectorAll("a[data-route]").forEach(link=>link.setAttribute("href",`#${link.dataset.route}`));const titles={"credit-cards":"Credit Cards","personal-loans":"Personal Loans","business-loans":"Business Loans","home-loans":"Home Loans","gold-loans":"Gold Loans","emi":"Consumer EMI","iphone-on-emi":"iPhone on EMI","eligibility":"Eligibility","application-status":"Application Status","about":"About Credigo","faq":"Frequently Asked Questions","apply":"Application Request"};const path=routePath().split("/").filter(Boolean);document.title=path.length?`${titles[path[0]]||"Explore financial products"} — Credigo`:"Credigo — Financial Choices, Made Simpler.";const current=routePath();document.querySelectorAll("#nav-links [data-route]").forEach(link=>link.classList.toggle("current",link.dataset.route===current));document.querySelectorAll(".nav-group").forEach(group=>{const active=Array.from(group.querySelectorAll(".dropdown [data-route]")).some(link=>current===link.dataset.route||link.dataset.route!=="/credit-cards"&&current.startsWith(link.dataset.route+"/"));group.querySelector(".nav-trigger").classList.toggle("current",active)});updateCatalog();updateCalculators();renderTray()}
    function renderTray(){const items=compareIds.map(id=>creditCards.find(c=>c.id===id)).filter(Boolean);const root=document.getElementById("compare-tray-root"),mobile=document.getElementById("mobile-compare-root");if(!items.length){root.innerHTML="";mobile.innerHTML="";return}const tray=`<div class="compare-tray"><strong>${items.length} card${items.length===1?"":"s"} selected</strong><div class="tray-names">${items.map(c=>`<span class="tray-name">${escapeHtml(c.name)}</span>`).join("")}</div><a class="button primary small" ${href("/credit-cards/compare")}>Compare now <span class="arrow">→</span></a></div>`;root.innerHTML=tray;mobile.innerHTML=`<a class="button primary" ${href("/credit-cards/compare")}>Compare ${items.length} selected card${items.length===1?"":"s"} <span class="arrow">→</span></a>`}
    function updateCalculators(){const amount=document.querySelector("[data-loan-amount]");if(amount){const range=document.querySelector("[data-loan-range]"),rate=Number(document.querySelector("[data-interest]").value),months=Number(document.querySelector("[data-tenure]").value),principal=Math.max(0,Number(amount.value)||0),monthlyRate=rate/1200;const emi=months>0?(monthlyRate===0?principal/months:principal*monthlyRate*Math.pow(1+monthlyRate,months)/(Math.pow(1+monthlyRate,months)-1)):0;const total=emi*months,interest=total-principal;document.querySelector("[data-emi-result]").textContent=money(Math.round(emi));document.querySelector("[data-principal-result]").textContent=money(principal);document.querySelector("[data-interest-result]").textContent=money(Math.max(0,Math.round(interest)));document.querySelector("[data-total-result]").textContent=money(Math.round(total));document.querySelector("[data-months-result]").textContent=`${months} months`;document.querySelector("[data-principal-bar]").style.width=`${total?principal/total*100:0}%`;document.querySelector("[data-interest-bar]").style.width=`${total?Math.max(0,interest/total*100):0}%`;if(range&&Number(range.value)!==principal)range.value=Math.min(Number(range.max),Math.max(Number(range.min),principal))}const goldWeight=document.querySelector("[data-gold-weight]");if(goldWeight){const grams=Math.max(0,Number(goldWeight.value)||0),purity=Number(document.querySelector("[data-gold-purity]").value),price=Math.max(0,Number(document.querySelector("[data-gold-price]").value)||0),value=grams*purity*price;document.getElementById("gold-value").textContent=money(Math.round(value));document.getElementById("gold-loan").textContent=`${money(Math.round(value*.6))} – ${money(Math.round(value*.75))}`}const iphone=document.querySelector("[data-iphone-model]");if(iphone){const price=Number(iphone.value)+Number(document.querySelector("[data-iphone-storage]").value),down=Math.min(price,Math.max(0,Number(document.querySelector("[data-iphone-down]").value)||0)),months=Number(document.querySelector("[data-iphone-tenure]").value);document.querySelector("[data-device-price]").textContent=money(price);document.querySelector("[data-device-down]").textContent=money(down);document.querySelector("[data-device-emi]").textContent=money(Math.ceil((price-down)/months))}const emiPrice=document.querySelector("[data-emi-price]");if(emiPrice){const result=document.querySelector("[data-emi-result]");if(result){const months=Number(document.querySelector("[data-tenure]").value),price=Number(emiPrice.value)||0;result.textContent=money(Math.ceil(price/months));document.querySelector("[data-principal-result]").textContent=money(price);document.querySelector("[data-interest-result]").textContent=money(0);document.querySelector("[data-total-result]").textContent=money(price);document.querySelector("[data-months-result]").textContent=`${months} months`;document.querySelector("[data-principal-bar]").style.width="100%";document.querySelector("[data-interest-bar]").style.width="0%"}}}
    function toggleCompare(id,checked){if(compareIds.includes(id)&&checked===false)compareIds=compareIds.filter(x=>x!==id);else if(!compareIds.includes(id)){if(compareIds.length>=3){announce("You can compare up to three cards. Remove one to add another.");renderTray();return}compareIds=[...compareIds,id]}saveStore("credigo-compare",compareIds);renderTray();if(routePath()==="/credit-cards")updateCatalog();else if(routePath().endsWith("/compare"))render()}
    function announce(message){let el=document.getElementById("live-message");if(!el){el=document.createElement("div");el.id="live-message";el.setAttribute("role","status");el.style.cssText="position:fixed;left:16px;bottom:18px;z-index:50;padding:12px 16px;background:#14221f;color:white;border-radius:9px;box-shadow:0 8px 30px #0002";document.body.appendChild(el)}el.textContent=message;clearTimeout(announce.timer);announce.timer=setTimeout(()=>el.remove(),3000)}
    function validate(form){let valid=true;form.querySelectorAll("[required]").forEach(input=>{const error=form.querySelector(`[data-error-for="${input.name}"]`);let message="";if(!input.value.trim())message="This field is required.";else if(input.name==="mobile"&&!/^[6-9]\d{9}$/.test(input.value.trim()))message="Enter a valid 10-digit Indian mobile number.";else if(input.name==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim()))message="Enter a valid email address.";else if(input.type==="number"&&(Number(input.value)<Number(input.min||0)||input.max&&Number(input.value)>Number(input.max)))message="Enter a valid number.";if(error)error.textContent=message;input.setAttribute("aria-invalid",String(Boolean(message)));if(message)valid=false});return valid}
    function formValues(form){return Object.fromEntries(new FormData(form).entries())}
    function routeLinkClick(event){const link=event.target.closest("[data-route]");if(!link)return;event.preventDefault();go(link.dataset.route)}
    document.addEventListener("click",event=>{const route=event.target.closest("[data-route]");if(route){routeLinkClick(event);return}const menu=event.target.closest("[data-menu-toggle]");if(menu){const nav=document.querySelector(".nav-links"),open=!nav.classList.contains("open");nav.classList.toggle("open",open);menu.setAttribute("aria-expanded",String(open));menu.setAttribute("aria-label",open?"Close navigation":"Open navigation");document.body.classList.toggle("menu-active",open);return}const apply=event.target.closest("[data-apply]");if(apply){saveStore("credigo-draft",{product:apply.dataset.apply});go(`/apply?product=${encodeURIComponent(apply.dataset.apply)}`);return}const cmp=event.target.closest("[data-compare]");if(cmp){if(cmp.matches("input"))return;toggleCompare(cmp.dataset.compare,!compareIds.includes(cmp.dataset.compare));return}const remove=event.target.closest("[data-remove-compare]");if(remove){toggleCompare(remove.dataset.removeCompare,false);return}if(event.target.closest("[data-clear-filters]")){searchTerm="";selectedTypes.clear();selectedBanks.clear();selectedBenefits.clear();render();return}const choice=event.target.closest("[data-finder-choice]");if(choice){finder[["spend","priority","fee"][finder.step]]=choice.dataset.finderChoice;render();return}if(event.target.closest("[data-finder-next]")){if(finder.step<3)finder.step++;render();return}if(event.target.closest("[data-finder-back]")){finder.step=Math.max(0,finder.step-1);render();return}if(event.target.closest("[data-finder-restart]")){finder={step:0,spend:"",priority:"",fee:""};render();return}if(event.target.closest("[data-eligibility-back]")){eligibilityStep=0;render();return}if(event.target.closest("[data-eligibility-restart]")){eligibilityStep=0;render();return}if(event.target.closest("[data-app-back]")){const s=Number(routeParams().get("step")||0);go(`/apply?step=${Math.max(0,s-1)}`);return}const emi=event.target.closest("[data-emi-product]");if(emi){go("/emi#emi-calculator");setTimeout(()=>{const input=document.querySelector("[data-emi-price]");if(input){input.value=emi.dataset.emiProduct;updateCalculators()}},30)}});
    document.addEventListener("change",event=>{const el=event.target;if(el.matches("[data-compare]")){toggleCompare(el.dataset.compare,el.checked);return}if(el.matches("[data-filter-bank]")){selectedBanks=el.value?new Set([el.value]):new Set();updateCatalog();return}if(el.matches("[data-type-filter]")){el.checked?selectedTypes.add(el.dataset.typeFilter):selectedTypes.delete(el.dataset.typeFilter);updateCatalog();return}if(el.matches("[data-benefit-filter]")){el.checked?selectedBenefits.add(el.dataset.benefitFilter):selectedBenefits.delete(el.dataset.benefitFilter);updateCatalog();return}if(el.matches("[data-iphone-model],[data-iphone-storage],[data-iphone-tenure]"))updateCalculators()});
    document.addEventListener("input",event=>{const el=event.target;if(el.matches("[data-card-search]")){searchTerm=el.value;updateCatalog();return}if(el.matches("[data-loan-range]")){const amount=document.querySelector("[data-loan-amount]");if(amount)amount.value=el.value;updateCalculators();return}if(el.matches("[data-loan-amount]")){updateCalculators();return}if(el.matches("[data-interest],[data-tenure],[data-gold-weight],[data-gold-purity],[data-gold-price],[data-iphone-down],[data-emi-price]"))updateCalculators()});
    document.addEventListener("submit",event=>{const form=event.target;if(form.id==="eligibility-form"){event.preventDefault();if(!validate(form))return;if(eligibilityStep===0){const selected=form.elements.product.value;history.replaceState(null,"",location.protocol==="file:"?`#/eligibility?product=${encodeURIComponent(selected)}`:`/eligibility?product=${encodeURIComponent(selected)}`);eligibilityStep=1;render()}else{eligibilityStep=3;render()}return}if(form.id==="application-form"){event.preventDefault();const step=Number(form.dataset.step);if(step<3){if(!validate(form))return;const values=formValues(form),draft={...readStore("credigo-draft",{}),...values};saveStore("credigo-draft",draft);go(`/apply?step=${step+1}`);return}const submit=form.querySelector('[type="submit"]');submit.disabled=true;submit.textContent="Saving on this device…";setTimeout(()=>{submit.textContent="Preparing your reference…";setTimeout(()=>{const draft=readStore("credigo-draft",{});const reference=`CRD-${String(Math.floor(100000+Math.random()*900000))}`;const applications=readStore("credigo-applications",[]);applications.push({...draft,reference,product:draft.product||"Financial product",submittedAt:new Date().toISOString(),status:"Request Received"});saveStore("credigo-applications",applications);saveStore("credigo-draft",{});go(`/apply?ref=${reference}`)},450)},450);return}if(form.id==="status-form"){event.preventDefault();if(!validate(form))return;const ref=form.elements.reference.value.trim().toUpperCase(),apps=readStore("credigo-applications",[]),match=apps.find(x=>x.reference===ref),target=document.getElementById("status-result");target.innerHTML=match?`<div class="callout"><strong>Request Received</strong><br>Application submitted · Next: Review pending<br>Product: ${escapeHtml(match.product)}<br>This record is stored in this browser only.</div>`:`<p class="error-summary">Enter a valid application reference number saved in this browser.</p>`;return}});
    window.addEventListener("popstate",()=>{if(routePath()==="/credit-cards/find")finder={step:0,spend:"",priority:"",fee:""};render()});
    window.addEventListener("hashchange",()=>{if(location.protocol==="file:"){if(routePath()==="/credit-cards/find")finder={step:0,spend:"",priority:"",fee:""};render()}});
    window.addEventListener("scroll",()=>document.getElementById("site-header").classList.toggle("scrolled",window.scrollY>12),{passive:true});
    document.querySelectorAll(".nav-trigger").forEach(trigger=>trigger.setAttribute("aria-expanded","false"));
    document.addEventListener("click",event=>{if(event.target.matches(".nav-group > .nav-trigger")&&window.matchMedia("(max-width:760px)").matches){const group=event.target.parentElement,open=group.classList.toggle("mobile-open");event.target.setAttribute("aria-expanded",String(open));const drop=group.querySelector(".dropdown");drop.style.display=open?"grid":"none"}});
    render();
    if(routePath()==="/credit-cards"&&routeParams().has("need")){const search=document.querySelector("[data-card-search]");if(search)search.value=searchTerm;updateCatalog()}
  })();
  </script>
